    if (PHASES[phase].lit) { const [bx, by] = iso(wt[0] + .5, wt[1] + .5, 74); lights.push(`<circle cx="${bx}" cy="${by}" r="18" fill="url(#bulb)"/>`); }
    objects.push({ z: wt[0] + wt[1] + 1, svg: `<g class="clickable ${selected && selected.kind === "runs" ? "sel" : ""}" data-kind="runs">
      ${box(wt[0], wt[1], 1, 1, 14, "#686D6C") + walls(wt[0], wt[1], 1, 1, 14, "stone", false)}${box(wt[0] + .2, wt[1] + .2, .6, .6, 56, "#A6ABAA", 14) + walls(wt[0] + .2, wt[1] + .2, .6, .6, 70, "stone", false)}
      ${box(wt[0] + .05, wt[1] + .05, .9, .9, 8, "#494D4C", 70)}${pyramid(wt[0] + .05, wt[1] + .05, .9, .9, 78, failed ? "#B42318" : "#006E4A", 22)}</g>` });
    const [nx, ny] = iso(nb[0], nb[1] + 1.1, 84);
    const [wx, wy] = iso(wt[0] + .5, wt[1] + .5, 114);
    labels += `<div class="label small" data-for="list" style="left:${nx}px;top:${ny}px"><span class="nm">My list</span><span class="n" style="background:#B45309">${MY_LIST.filter(t => !t.done).length}</span></div>`;
    labels += `<div class="label small ${failed ? "" : "nonum"}" data-for="runs" style="left:${wx}px;top:${wy}px"><span class="nm">Night watch</span>${failed ? `<span class="n" style="background:#B42318">${failed} !</span>` : ""}</div>`;

    TREES.forEach(([x, y], i) => objects.push({ z: x + y + 1, svg: tree(x, y, i % 3 === 0) }));
    LAMPS.forEach(([x, y]) => objects.push({ z: x + y, svg: lamp(x, y) }));
    countryside(objects);
    objects.sort((a, b) => a.z - b.z);

    // Time of day: a colour filter over the scene. Each object's lights go straight after it, outside
    // the filter, so they glow through the dusk but stay behind whatever is drawn in front.
    const ph = PHASES[phase];
    const [r, g, b] = ph.tint ? [1, 3, 5].map(i => 1 - ph.op * (1 - parseInt(ph.tint.slice(i, i + 2), 16) / 255)) : [1, 1, 1];
    const defs = `<defs>
      <filter id="tod" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${r} 0 0 0 0  0 ${g} 0 0 0  0 0 ${b} 0 0  0 0 0 1 0"/></filter>
      <radialGradient id="bulb"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".95"/><stop offset=".35" stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
      <radialGradient id="pool"><stop offset="0" stop-color="#FDE68A" stop-opacity=".55"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
      <radialGradient id="domeShade" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></radialGradient>
      <linearGradient id="cylShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
      <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
      <pattern id="pt-brick" width="12" height="7" patternUnits="userSpaceOnUse"><path d="M0 .3H12M0 3.8H12M6 .3V3.8M0 3.8V7M12 3.8V7" stroke="rgba(0,0,0,.16)" stroke-width=".7" fill="none"/></pattern>
      <pattern id="pt-stone" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="rgba(255,255,255,.08)"/><path d="M0 .4H20M0 5.4H20M10 .4V5.4M0 5.4V10M20 5.4V10" stroke="rgba(0,0,0,.13)" stroke-width=".8" fill="none"/></pattern>
      <pattern id="pt-marble" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 .4H24M12 .4V12" stroke="rgba(0,0,0,.06)" stroke-width=".6"/><path d="M3 9Q8 6 14 8" stroke="rgba(120,130,128,.15)" fill="none" stroke-width=".6"/></pattern>
      <pattern id="pt-glass" width="9" height="15" patternUnits="userSpaceOnUse"><rect width="9" height="15" fill="rgba(180,215,240,.14)"/><path d="M.4 0V15M0 .4H9" stroke="rgba(255,255,255,.3)" stroke-width=".8"/><path d="M1 14L8 2" stroke="rgba(255,255,255,.12)" stroke-width="1.5"/></pattern>
      <pattern id="pt-siding" width="10" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.6H10" stroke="rgba(0,0,0,.14)" stroke-width=".8"/><path d="M0 .4H10" stroke="rgba(255,255,255,.12)" stroke-width=".6"/></pattern>
      <radialGradient id="pitchGlow"><stop offset="0" stop-color="#FFF6D8" stop-opacity=".5"/><stop offset=".6" stop-color="#FFF6D8" stop-opacity=".18"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4C2" stop-opacity=".55"/><stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/></linearGradient>
      <pattern id="pt-vip" width="12" height="8" patternUnits="userSpaceOnUse"><rect x="1" y="1.5" width="10" height="5" fill="${PHASES[phase].lit ? "#F5D46A" : "#5B7A99"}" opacity=".8"/><path d="M0 0V8" stroke="#0A0D0C" stroke-width="1"/></pattern>
      <pattern id="pt-seats" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="3" fill="${BLAU}"/><rect y="3" width="10" height="3" fill="${GRANA}"/><path d="M0 2.6H10M0 5.6H10" stroke="rgba(0,0,0,.25)" stroke-width=".6"/></pattern>
      <pattern id="pt-crowd" width="17" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#FCFFFE" opacity=".8"/><circle cx="7.5" cy="5" r="1.2" fill="${GOLD}" opacity=".85"/><circle cx="12" cy="1.6" r="1.2" fill="#E0AC69" opacity=".9"/><circle cx="15" cy="6.4" r="1.3" fill="#FCFFFE" opacity=".6"/><circle cx="4.5" cy="7" r="1.2" fill="#8D5524" opacity=".85"/></pattern>
      <pattern id="pt-net" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0L4 4M4 0L0 4" stroke="rgba(255,255,255,.55)" stroke-width=".5"/></pattern>
      <pattern id="pt-paving" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 .5H18M.5 0V18" stroke="rgba(0,0,0,.07)" stroke-width="1"/></pattern>
      <pattern id="pt-gravel" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="rgba(0,0,0,.18)"/><circle cx="4.5" cy="4" r=".7" fill="rgba(255,255,255,.3)"/><circle cx="4" cy="1" r=".5" fill="rgba(0,0,0,.12)"/></pattern></defs>`;

    const tod = ph.tint ? 'filter="url(#tod)"' : "";
    let scene = "", run = path + walkers();
    objects.forEach(o => {
      run += o.svg;
      if (!o.lit) return;
      scene += `<g ${tod}>${run}</g><g pointer-events="none">${o.lit.join("")}</g>`;
      run = "";
    });
    document.getElementById("svg").innerHTML = defs + `<g ${tod}>${ground()}</g><g pointer-events="none">${pitchLight}</g>` +
      scene + `<g ${tod}>${run}</g>`;
    document.getElementById("labels").innerHTML = labels;

    const p = progress();
    document.getElementById("prog-text").textContent = p.total ? `${p.done} / ${p.total} done` : "No tasks yet";
    document.getElementById("prog-bar").style.width = p.pct + "%";
    renderHeader();

    const c = steps[cur];
    document.getElementById("next").innerHTML = !ITEMS.length
      ? `<div><div class="k">No data yet</div><div class="t">Nothing is connected yet, so the track is empty.</div><div class="s">Frappe, Slack and the rest get connected next. You can still add your own tasks from any building.</div></div>`
      : c ? `<div style="flex:1;min-width:0"><div class="k">Your move · pass ${cur}</div>
      <div class="t">${c.title}</div><div class="s"><span class="${c.due === "overdue" ? "late" : ""}">${c.when}</span> · ${c.sub}</div></div>
      ${c.src === "local" ? `<button class="go" data-act="done" data-id="${c.id}">Mark done ✓</button>` : `<a class="go" href="${c.url || "#"}" target="_blank">${goLabel(c)} →</a>`}`
      : `<div><div class="k">All clear</div><div class="t">Every square done. Time for the evening review.</div></div>`;

    renderPop(steps);
  }

  // Today's date, when the data was last refreshed, and the scoreboard (or that it isn't connected).
  function renderHeader() {
    const today = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
    document.getElementById("meta").textContent = `${today} · refreshed ${hhmm(META.refreshedAt)}`;
    // Anything out of date or failing gets named up front, with the time its data is from.
    const off = META.sources.filter(s => s.status === "stale" || s.status === "error");
    const warn = document.getElementById("warn");
    warn.hidden = !off.length;
    if (off.length) {
      const say = s => s.status === "error" ? `${s.label}: problem` : `${s.label} from ${hhmm(s.refreshedAt)}`;
      warn.textContent = off.length === 1 ? `⚠ ${say(off[0])}` : `⚠ ${off.length} sources out of date`;
      warn.title = off.map(s => s.status === "error" ? `${s.label}: ${s.note || "couldn't be read"}` : `${s.label}: data from ${hhmm(s.refreshedAt)}`).join("\n") + "\n\nClick to refresh now.";
    }
    const chk = '<span class="check">CHECK</span>';
    document.getElementById("score").innerHTML = SCORE
      ? `<span class="ic">₹</span><b>${SCORE.clients}</b> paying${SCORE.clientsUnconfirmed ? " " + chk : ""} · <b>${SCORE.mrr || "—"}</b> MRR${SCORE.mrrUnconfirmed ? " " + chk : ""} · checked ${SCORE.checked || "—"}`
      : `<span class="ic">₹</span>Scoreboard not connected`;
    document.getElementById("scorepanel").innerHTML = SCORE ? `<h3>Clients and revenue</h3>
      <div class="muted" style="font-size:12px">As written in clients-and-revenue.md · last checked ${SCORE.checked || "—"}</div>
      <div class="big"><div><b>${SCORE.clients}</b><span>paying, confirmed${SCORE.clientsUnconfirmed ? " " + chk : ""}</span></div>
        <div><b>${SCORE.mrr || "—"}</b><span>MRR ${SCORE.mrrNote}${SCORE.mrrUnconfirmed ? " " + chk : ""}</span></div></div>
      ${SCORE.groups.map(g => `<div class="row"><span class="n">${g.count}</span><div><b>${g.status}</b>${g.unconfirmed ? ` ${chk} <span class="muted" style="font-size:11px">${g.unconfirmed} unconfirmed</span>` : ""}<div class="names">${g.names.join(", ")}</div></div></div>`).join("")}
      <div class="src">CHECK means the file marks it as not confirmed yet. Source: ${SCORE.file}</div>`
      : `<h3>Scoreboard not connected</h3><div class="muted">clients-and-revenue.md wasn't found on the H: drive.</div>`;
  }

  function goLabel(i) {
    return { frappe: "Open lead", gmail: "Open draft", slack: "Open in Slack", calendar: "Open event", drive: "Open file", sheet: "Open sheet" }[i.src];
  }

  // Items on the track jump to their square; the rest open straight in their app.
  const itemRow = (i) => {
    const inner = `<span class="chip ${i.src === "local" ? "mine" : ""}">${chip(i, mode)}</span><span class="m">${i.title}</span><span class="w ${i.due === "overdue" ? "late" : ""}">${i.when}</span>`;
    return i.onTrack === false
      ? `<a class="it ${i.done ? "done" : ""}" href="${i.url || "#"}" target="_blank" style="text-decoration:none">${inner}</a>`
      : `<button class="it ${i.done ? "done" : ""}" data-goto="${i.id}">${inner}</button>`;
  };
  const backlogRow = (key) => {
    const n = mode === "area" && BACKLOG.counts[key];
    return n ? `<a class="it" href="${BACKLOG.url}" target="_blank" style="text-decoration:none"><span class="chip">BACKLOG</span><span class="m">${n} more overdue by over ${BACKLOG.days} days</span><span class="w">Open in Frappe →</span></a>` : "";
  };
  const addBox = (placeholder, target) => `<form class="add" data-add="${target}"><input name="t" placeholder="${placeholder}" autocomplete="off"><button class="btn2">Add</button></form>`;

  // Detail pop-up for whatever is selected, placed beside it.
  function renderPop(steps) {
    const pop = document.getElementById("pop");
    if (!selected || selected.kind !== "locker") lockerEditing = null;   // closing the locker drops a half-done edit
    if (!selected) { pop.hidden = true; return; }
    let head, body, color, anchor;
    const p = progress();
    if (selected.kind === "step" && selected.id === "start") {
      const [x, y] = trackLayout(steps).at(0);
      color = BLAU; anchor = iso(x + .5, y + .5);
      head = `<div><div class="k">Kick-off · 09:00</div><h3>Morning brief</h3></div>`;
      const digest = RUNS.find(r => r.name === "BD digest");
      body = `<dl class="facts"><dt>Digest</dt><dd>${digest ? digest.note : "No digest report yet"}</dd><dt>Today</dt><dd>${p.total - p.done} squares to clear, ${ITEMS.filter(i => i.due === "overdue" && !i.done).length} overdue</dd></dl>
        ${digest && digest.url ? `<div class="actions"><a class="go" href="${digest.url}" target="_blank">Open digest in Slack →</a></div>` : ""}`;
    } else if (selected.kind === "step" && selected.id === "finish") {
      const n = steps.findIndex(s => s.id === "finish"), [x, y] = trackLayout(steps).at(n);
      color = GRANA; anchor = iso(x + .5, y + .5);
      head = `<div><div class="k">Full time · 17:00</div><h3>Evening review</h3></div>`;
      const waiting = dueToday - (steps.length - 2 - ITEMS.filter(i => i.src === "local").length);
      body = `<dl class="facts"><dt>Block</dt><dd>Your usual review, 17:00–19:00</dd><dt>So far</dt><dd>${p.done} of ${p.total} done (${p.pct}%)</dd><dt>Wrap</dt><dd>Your end-of-day wrap usually arrives 16:55 in Slack</dd>
        ${waiting > 0 ? `<dt>Also due</dt><dd>${waiting} more due today wait in their buildings (today's track is set to ${daySize}).</dd>` : ""}</dl>
        <div class="actions"><a class="go" href="https://calendar.google.com/calendar/r/day" target="_blank">Open calendar →</a></div>`;
    } else if (selected.kind === "step") {
      const n = steps.findIndex(s => s.id === selected.id), s = steps[n];
      if (!s) { selected = null; pop.hidden = true; return; }
      const [x, y] = trackLayout(steps).at(n);
      color = s.src === "local" ? "#0A7E57" : AREAS[s.area].color; anchor = iso(x + .5, y + .5);
      head = `<div><div class="k">Pass ${n} of ${steps.length - 2}</div><h3>${s.title}</h3></div>`;
      body = `<dl class="facts"><dt>What</dt><dd>${s.sub}</dd><dt>When</dt><dd class="${s.due === "overdue" ? "late" : ""}">${s.when}</dd>
        <dt>Area</dt><dd>${AREAS[s.area].label}${s.stage ? " · " + s.stage : ""}</dd><dt>From</dt><dd>${SOURCES[s.src].from}</dd></dl>
        <div class="actions">${s.src !== "local" ? `<a class="go" href="${s.url || "#"}" target="_blank">${goLabel(s)} →</a>` : ""}
          <button class="btn2" data-act="${s.done ? "undo" : "done"}" data-id="${s.id}">${s.done ? "Undo" : "Mark done ✓"}</button></div>
        ${s.src !== "local" ? `<div class="note">Marks it done here only. ${SOURCES[s.src].from} stays as it is.</div>` : ""}
        ${addBox("Add a follow-up task…", "after:" + s.id)}`;
    } else if (selected.kind === "group" || selected.kind === "protest") {
      const g = groupItems(mode).find(g => g.key === selected.key), n = Object.keys(GROUPINGS[mode]).indexOf(selected.key);
      const [x, y, w = 2, d = 2] = BUILDING_SLOTS[n];
      color = g.color; anchor = iso(x + w / 2, y + d / 2, 40);
      if (selected.kind === "protest") {
        const late = g.items.filter(i => i.due === "overdue" && !i.done);
        head = `<div><div class="k">Protest at ${g.label}</div><h3>${late.length} overdue</h3></div>`;
        body = `<div class="from">Clear these and the crowd goes home.</div>` + late.map(itemRow).join("");
      } else {
        head = `<div><div class="k">${mode === "area" ? LANDMARKS[STYLES[n]] : { source: "Channel", urgency: "Due" }[mode]}</div><h3>${g.label}</h3></div>`;
        body = `<div class="from">${g.from || g.items.length + " items"}</div>` + (g.items.length ? g.items.map(itemRow).join("") : '<div class="muted">Nothing here. All clear.</div>') +
          backlogRow(g.key) + addBox(`Add a task to ${g.label}…`, "group:" + g.key);
      }
    } else if (selected.kind === "locker") {
      const [x, y, w, d] = LOCKER_ROOM;
      color = BLAU; anchor = iso(x + w / 2, y + d / 2, 40);
      head = `<div><div class="k">Locker room</div><h3>Links and logins</h3></div>`;
      // The form adds a new entry, or (after Edit) changes that one in place.
      const ed = lockerEditing && (LOCKER || []).find(e => e.id === lockerEditing) || {}, v = k => esc(ed[k] || "");
      body = (LOCKER && LOCKER.length > 6 ? `<input class="lsearch" placeholder="Search the locker…" value="${esc(lockerQuery)}" autocomplete="off">` : "") +
        (LOCKER === null ? '<div class="muted">Opening…</div>' : LOCKER.length ? LOCKER.map(lockerRow).join("") : '<div class="muted">Empty. Add a link or a login below.</div>') +
        `<form class="lform" data-locker>${ed.id ? `<div class="wide k-edit">Editing <b>${v("label")}</b></div>` : ""}
          <input name="label" class="wide" placeholder="Name, e.g. Staging admin" maxlength="60" autocomplete="off" value="${v("label")}">
          <input name="url" class="wide" placeholder="Link (optional), https://…" autocomplete="off" value="${v("url")}">
          <input name="user" placeholder="Account ID" autocomplete="off" value="${v("user")}"><input name="password" type="password" placeholder="Password" autocomplete="new-password" value="${v("password")}">
          <input name="note" class="wide" placeholder="Note (optional)" autocomplete="off" value="${v("note")}">
          ${ed.id ? `<button class="btn2">Save changes</button><button class="btn2" type="button" data-lcancel>Cancel</button>` : '<button class="btn2 wide">Add to locker</button>'}</form>
        <div class="note">For low-risk accounts only, like test logins. Saved as plain text on this PC (data\\locker.json), never on GitHub.</div>`;
    } else if (selected.kind === "list") {
      color = "#B45309"; anchor = iso(NOTICE_BOARD[0], NOTICE_BOARD[1] + 1.1, 40);
      head = `<div><div class="k">Notice board</div><h3>My list</h3></div>`;
      body = MY_LIST.map((t, i) => `<button class="line" data-tick="${i}"><span class="tick ${t.done ? "on" : ""}">${t.done ? "✓" : ""}</span><span class="${t.done ? "struck" : ""}">${esc(t.text)}</span></button>`).join("") +
        addBox("Add to my list…", "list");
    } else {
      color = "#494D4C"; anchor = iso(WATCHTOWER[0] + .5, WATCHTOWER[1] + .5, 60);
      head = `<div><div class="k">Night watch</div><h3>Scheduled runs</h3></div>`;
      body = RUNS.length
        ? RUNS.map(r => `<div class="line"><span class="${r.ok ? "ok" : "bad"}">${r.ok ? "✓" : "!"}</span><b>${r.name}</b><span class="muted" style="flex:1">${r.note}</span>${r.url ? `<a href="${r.url}" target="_blank" class="muted">Open →</a>` : ""}</div>`).join("")
        : '<div class="muted">No run reports yet. Once the scheduled jobs write their summaries, they show up here.</div>';
    }
    pop.innerHTML = `<header style="background:${color}">${head}<button class="x" data-close>×</button></header><div class="body">${body}</div>`;
    pop.hidden = false;
    // Open to the right of the object, or to the left when near the right edge.
    const left = anchor[0] > 700 ? anchor[0] - 370 : anchor[0] + 30;
    const top = Math.max(10, Math.min(anchor[1] - 120, 660 - pop.offsetHeight - 10));
    pop.style.left = left + "px"; pop.style.top = top + "px";
    if (focusAdd) { const inp = pop.querySelector(".add input"); inp && inp.focus(); focusAdd = false; }
  }

  // ---------- Locker room ----------

  // Entries come from the app (data\locker.json). A password only appears on the page when you press Show.
  let LOCKER = null, lockerEditing = null, lockerQuery = "";
  const loadLocker = () => fetch("/api/locker").then(r => r.json()).then(d => { LOCKER = d.entries; if (selected && selected.kind === "locker") render(); }).catch(() => {});
  loadLocker();
  // Search matches the name, link, account ID and note (never the password).
  const lockerMatch = e => !lockerQuery || [e.label, e.url, e.user, e.note].join(" ").toLowerCase().includes(lockerQuery.toLowerCase());
  const lockerRow = e => `<div class="lk" ${lockerMatch(e) ? "" : "hidden"} data-lrow="${esc([e.label, e.url, e.user, e.note].join(" ").toLowerCase())}"><div class="t"><b>${e.url ? `<a href="${safeUrl(e.url)}" target="_blank">${esc(e.label)}</a>` : esc(e.label)}</b>
      ${e.url ? `<button class="s" data-copy="${esc(e.url)}">Copy link</button>` : ""}<button class="s" data-ledit="${esc(e.id)}">Edit</button><button class="s" data-ldel="${esc(e.id)}">Delete</button></div>
    ${e.user ? `<div class="f">ID <code>${esc(e.user)}</code><button class="s" data-copy="${esc(e.user)}">Copy</button></div>` : ""}
    ${e.password ? `<div class="f">Password <code data-pw="${esc(e.id)}">••••••</code><button class="s" data-show="${esc(e.id)}">Show</button><button class="s" data-copypw="${esc(e.id)}">Copy</button></div>` : ""}
    ${e.note ? `<div class="f">${esc(e.note)}</div>` : ""}</div>`;
  function copyText(text, btn) {
    const done = () => { const was = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = was, 1200); };
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(done, () => {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done();
    });
  }
  function lockerAct(el) {
    const entry = id => (LOCKER || []).find(e => e.id === id);
    const b = el.closest("[data-copy], [data-copypw], [data-show], [data-ldel], [data-ledit], [data-lcancel]");
    if (!b) return false;
    if (b.dataset.ledit) { lockerEditing = b.dataset.ledit; render(); document.querySelector(".lform input").focus(); }
    else if (b.dataset.lcancel !== undefined) { lockerEditing = null; render(); }
    else if (b.dataset.copy !== undefined) copyText(b.dataset.copy, b);
    else if (b.dataset.copypw) copyText(entry(b.dataset.copypw).password, b);
    else if (b.dataset.show) {
      const code = document.querySelector(`[data-pw="${CSS.escape(b.dataset.show)}"]`), shown = b.textContent === "Hide";
      code.textContent = shown ? "••••••" : entry(b.dataset.show).password;
      b.textContent = shown ? "Show" : "Hide";
    } else if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Sure?"; }
    else {
      fetch("/api/locker/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.ldel }) })
        .then(r => r.json()).then(d => { LOCKER = d.entries; render(); }).catch(loadLocker);
    }
    return true;
  }
  function addToLocker(form) {
    const entry = Object.fromEntries(["label", "url", "user", "password", "note"].map(k => [k, form[k].value.trim()]));
    // Problems are shown under the form without redrawing it, so nothing typed is lost.
    const say = text => { form.nextElementSibling.textContent = text; form.nextElementSibling.classList.add("late"); };
    if (!entry.label) return say("Give it a name first.");
    if (entry.url && !/^https?:\/\//i.test(entry.url)) return say("A link starts with http:// or https://");
    const editing = lockerEditing;
    fetch(editing ? "/api/locker/update" : "/api/locker", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(editing ? { ...entry, id: editing } : entry) })
      .then(r => {
        // An app opened before the Locker room existed doesn't know it yet.
        if (r.status === 404) throw new Error("Close the app and open it again to finish updating it, then try again.");
        if (!r.ok) throw new Error("Couldn't save that entry. Check the name and link.");
        return r.json();
      })
      .then(d => { LOCKER = d.entries; lockerEditing = null; render(); })
      .catch(err => say(err.message.startsWith("Close") || err.message.startsWith("Couldn't save that") ? err.message : "Couldn't save. Is the app running?"));
  }
  // Typing in the search box hides entries that don't match, without redrawing (so typing isn't lost).
  document.getElementById("pop").addEventListener("input", e => {
    if (!e.target.classList.contains("lsearch")) return;
    lockerQuery = e.target.value.trim();
    document.querySelectorAll("[data-lrow]").forEach(row => row.hidden = !!lockerQuery && !row.dataset.lrow.includes(lockerQuery.toLowerCase()));
  });

  // ---------- Interaction ----------

  function act(el) {
    if (lockerAct(el)) return true;
    const a = el.closest("[data-act]");
    // Ids are stored escaped (see cleanData) and the browser un-escapes attributes, so escape again to match.
    if (a) { setDone(esc(a.dataset.id), a.dataset.act === "done"); render(); return true; }
    const go = el.closest("[data-goto]");
    if (go) { selected = { kind: "step", id: esc(go.dataset.goto) }; render(); return true; }
    const tk = el.closest("[data-tick]");
    if (tk) { const t = MY_LIST[+tk.dataset.tick]; t.done = !t.done; saveList(); render(); return true; }
    return false;
  }

  document.getElementById("pop").addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.dataset.locker !== undefined) { addToLocker(e.target); return; }
    const form = e.target, text = form.t.value.trim();
    if (!text) return;
    // "after:<id>" or "group:<key>"; ids can contain colons (Slack ids do), so split at the first one only.
    const target = form.dataset.add, cut = target.indexOf(":");
    const kind = cut < 0 ? target : target.slice(0, cut), key = cut < 0 ? "" : esc(target.slice(cut + 1));
    if (kind === "list") {
      MY_LIST.push({ text, done: false }); saveList();
    } else if (kind === "after") {
      const src = ITEMS.find(i => i.id === key);
      addTask(text, src.area, key);
    } else {
      addTask(text, mode === "area" ? key : "other");
    }
    focusAdd = true;
    render();
  });

  document.getElementById("map").addEventListener("click", e => {
    if (e.target.closest("[data-close]")) { selected = null; render(); return; }
    if (e.target.closest("#pop")) { act(e.target); return; }
    // With names off, the number pills are clickable: open what they belong to.
    const lab = e.target.closest(".label[data-for]");
    if (lab) {
      const key = lab.dataset.for;
      selected = ["list", "runs", "locker"].includes(key) ? { kind: key } : ["start", "finish"].includes(key) ? { kind: "step", id: key } : { kind: "group", key };
      render();
      return;
    }
    const t = e.target.closest("[data-kind]");
    if (!t) { selected = null; render(); return; }
    const k = t.dataset.kind;
    // The big screen is the scoreboard: open the same details as the corner chip.
    if (k === "screen") { e.stopPropagation(); document.getElementById("scorepanel").hidden = false; return; }
    selected = k === "step" ? { kind: k, id: esc(t.dataset.id) } : (k === "group" || k === "protest") ? { kind: k, key: t.dataset.key } : { kind: k };
    render();
  });
  document.getElementById("next").addEventListener("click", e => act(e.target));

  document.getElementById("warn").addEventListener("click", () => window.parent.postMessage({ refresh: true }, "*"));

  // Scoreboard details open under the corner chip and close on any click elsewhere.
  document.addEventListener("click", e => {
    const panel = document.getElementById("scorepanel");
    if (e.target.closest("#score")) panel.hidden = !panel.hidden;
    else if (!e.target.closest("#scorepanel")) panel.hidden = true;
  });

  // ---------- Zoom, pan and the bottom-right controls ----------

  // Zoom is relative to "fit to screen": up to 2x (about double the pitch size), down to 0.7x.
  const ZOOM_MIN = .7, ZOOM_MAX = 2;
  let zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, +store.get("cc-zoom", 1) || 1)), pan = [0, 0];
  const stage = document.getElementById("stage");

  function fit() {
    const st = stage.getBoundingClientRect();
    // The stadium and its landmarks are wider than The Base, so fit a wider area.
    const s = Math.min(st.width / 1180, (st.height - 20) / 660, 1.3) * zoom;
    // Keep the view from drifting off the base entirely.
    const lim = [st.width * (zoom - .4), st.height * (zoom - .4)].map(v => Math.max(60, v / 1.6));
    pan = pan.map((p, i) => Math.max(-lim[i], Math.min(lim[i], p)));
    document.getElementById("map").style.transform = `translate(-50%, -50%) translate(${pan[0]}px, ${pan[1]}px) scale(${s})`;
    // Zooming in spreads the passes apart but keeps each disc the same size on screen.
    // (Zooming out doesn't grow them, or they'd start overlapping.)
    // (Set only when it changes: dragging calls fit() on every mouse move.)
    const ds = 1 / Math.max(1, zoom);
    if (ds !== discScale) document.getElementById("svg").style.setProperty("--disc-scale", discScale = ds);
  }
  let discScale = 1;
  function setZoom(z) {
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    if (zoom <= 1) pan = [0, 0];
    store.set("cc-zoom", zoom);
    fit();
  }
  window.addEventListener("resize", fit);
  // Ctrl + scroll zooms; a plain scroll is left alone, so lists in the pop-ups scroll as usual.
  stage.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });

  // Drag to move around. A real drag swallows the click that ends it, so it doesn't open a pop-up.
  let drag = null, swallowClick = false;
  stage.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest(".pop, .next, .ctrls")) return;
    drag = { x: e.clientX, y: e.clientY, pan: [...pan], moved: false };
  });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    drag.moved = true;
    stage.classList.add("dragging");
    pan = [drag.pan[0] + dx, drag.pan[1] + dy];
    fit();
  });
  window.addEventListener("pointerup", () => {
    if (drag && drag.moved) swallowClick = true;
    drag = null;
    stage.classList.remove("dragging");
  });
  stage.addEventListener("click", e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

  // Names on or off. With names off, hovering a building (or its number) shows its name.
  let compact = store.get("cc-compact", false);
  const applyCompact = () => {
    document.body.classList.toggle("compact", compact);
    document.querySelector('[data-c="labels"]').classList.toggle("on", !compact);
  };
  const labelKey = el => {
    const t = el.closest("[data-kind]");
    if (!t) return null;
    return t.dataset.kind === "group" || t.dataset.kind === "protest" ? t.dataset.key : t.dataset.kind === "step" ? t.dataset.id : t.dataset.kind;
  };
  document.getElementById("svg").addEventListener("mouseover", e => {
    if (!compact) return;
    const key = labelKey(e.target);
    document.querySelectorAll(".label.show").forEach(l => l.classList.remove("show"));
    if (key) document.querySelectorAll(`.label[data-for="${CSS.escape(esc(key))}"]`).forEach(l => l.classList.add("show"));
  });
  document.getElementById("svg").addEventListener("mouseleave", () => document.querySelectorAll(".label.show").forEach(l => l.classList.remove("show")));

  const applyPassMap = () => {
    document.querySelector('[data-c="spiral"]').classList.toggle("on", passMap === "spiral");
    document.querySelector('[data-c="shuffle"]').classList.toggle("on", passMap !== "spiral");
  };

  document.getElementById("ctrls").addEventListener("click", e => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    const c = b.dataset.c;
    if (c === "in") setZoom(zoom * 1.25);
    else if (c === "out") setZoom(zoom / 1.25);
    else if (c === "fit") { pan = [0, 0]; setZoom(1); }
    else if (c === "labels") { compact = !compact; store.set("cc-compact", compact); applyCompact(); }
    else {
      passMap = c === "spiral" ? "spiral" : String(Date.now() % 100000 + 1);
      store.set("cc-passmap", passMap);
      applyPassMap();
      render();
    }
  });
  applyCompact();
  applyPassMap();

  function setScene(p, dark) {
    phase = PHASES[p] ? p : "day";
    // Swap only the time-of-day classes, so other settings on the page (like names off) survive.
    document.body.classList.remove(...Object.keys(PHASES).map(p => "ph-" + p));
    document.body.classList.add("ph-" + phase);
    document.body.classList.toggle("dark", dark);
    document.getElementById("logo").src = dark ? "springmoney-logo-reversed.svg" : "springmoney-logo-primary.svg";
    render();
  }

  onGroupChange(m => { mode = m; selected = null; render(); });
  onDaySize(d => { if (d !== daySize) { daySize = d; selected = null; assignTrack(); render(); } });
  assignTrack();
  onScene(setScene);
  setScene("day", false); fit();
</script>
</body>
</html>
